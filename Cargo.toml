[package]
name = "barduino"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
eframe = { version = "0.36.2", features = ["persistence"] }
portable-pty = "0.9.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
vt100 = "0.16.2"

# The embedded browser uses the system WebView (WebView2 on Windows, WKWebView on macOS).
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
wry = "0.57.0"

# Stopping everything an agent started, through a job object.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Security", "Win32_System_JobObjects"] }

[dev-dependencies]
# The same format eframe saves app state in, to check old saves still load.
ron = "0.12.2"
