[package]
name = "barduino"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = { version = "0.36.2", features = ["persistence"] }
portable-pty = "0.9.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
vt100 = "0.16.2"

# The embedded browser uses the system WebView (WebView2 on Windows, WKWebView on macOS).
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
wry = "0.57.0"
